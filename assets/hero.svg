<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Andrew Gunn — Senior Full-Stack Engineer, Full-Stack Architect, Applied AI Engineer">
  <title>Andrew Gunn — Senior Full-Stack Engineer · Applied AI</title>

  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e1e22" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#4ade80" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#1e1e22" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1e1e22" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="378" rx="18"/>
    </clipPath>
  </defs>

  <!-- shell -->
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="380" fill="#0a0a0b"/>
    <rect x="0" y="0" width="1200" height="380" fill="url(#grid)" opacity="0.55"/>

    <ellipse cx="1010" cy="30" rx="420" ry="250" fill="url(#glow)">
      <animate attributeName="cx" values="1010;930;1010" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="180" cy="380" rx="360" ry="200" fill="url(#glow2)">
      <animate attributeName="cx" values="180;280;180" dur="18s" repeatCount="indefinite"/>
    </ellipse>

    <!-- title bar -->
    <rect x="0" y="0" width="1200" height="46" fill="#101012"/>
    <line x1="0" y1="46.5" x2="1200" y2="46.5" stroke="#1e1e22" stroke-width="1"/>
    <circle cx="26" cy="23" r="6" fill="#ff5f57"/>
    <circle cx="47" cy="23" r="6" fill="#febc2e"/>
    <circle cx="68" cy="23" r="6" fill="#28c840"/>
    <text x="600" y="28" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a8a93">andrewgunn.dev — ~/who-is-this-guy</text>

    <!-- prompt -->
    <text x="44" y="100" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
      <tspan fill="#4ade80">❯</tspan><tspan fill="#8a8a93" dx="10">whoami --verbose</tspan>
    </text>

    <!-- name -->
    <text x="42" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-1.6" fill="#e7e7ea">Andrew Gunn</text>

    <!-- role -->
    <text x="44" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#8a8a93">
      Senior Full-Stack Engineer <tspan fill="#2f2f36">·</tspan> Full-Stack Architect <tspan fill="#2f2f36">·</tspan> <tspan fill="#4ade80">Applied AI Engineer</tspan>
    </text>

    <!-- blurb -->
    <text x="44" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#6f6f78">
      10+ years shipping enterprise .NET, React, and cloud-native systems — plus production AI that actually runs.
    </text>
    <rect x="806" y="231" width="9" height="17" fill="#4ade80" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.9;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- rule -->
    <rect x="44" y="278" width="900" height="1" fill="url(#rule)"/>

    <!-- chips -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">
      <g>
        <rect x="44" y="306" width="71" height="30" rx="7" fill="#101012" stroke="#1e1e22"/>
        <text x="79.5" y="325.5" text-anchor="middle" fill="#a9a9b2">.NET 9</text>
      </g>
      <g>
        <rect x="125" y="306" width="64" height="30" rx="7" fill="#101012" stroke="#1e1e22"/>
        <text x="157" y="325.5" text-anchor="middle" fill="#a9a9b2">React</text>
      </g>
      <g>
        <rect x="199" y="306" width="78" height="30" rx="7" fill="#101012" stroke="#1e1e22"/>
        <text x="238" y="325.5" text-anchor="middle" fill="#a9a9b2">Next.js</text>
      </g>
      <g>
        <rect x="287" y="306" width="64" height="30" rx="7" fill="#101012" stroke="#1e1e22"/>
        <text x="319" y="325.5" text-anchor="middle" fill="#a9a9b2">Azure</text>
      </g>
      <g>
        <rect x="361" y="306" width="100" height="30" rx="7" fill="#101012" stroke="#1e1e22"/>
        <text x="411" y="325.5" text-anchor="middle" fill="#a9a9b2">Kubernetes</text>
      </g>
      <g>
        <rect x="471" y="306" width="128" height="30" rx="7" fill="#0f1a12" stroke="#4ade80" stroke-opacity="0.35"/>
        <text x="535" y="325.5" text-anchor="middle" fill="#4ade80">Agentic AI</text>
      </g>
    </g>

    <!-- location tag -->
    <g>
      <rect x="1000" y="306" width="156" height="30" rx="7" fill="#101012" stroke="#1e1e22"/>
      <circle cx="1020" cy="321" r="4" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="1034" y="325.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8a8a93">Milwaukee, WI</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#26262c"/>
</svg>
