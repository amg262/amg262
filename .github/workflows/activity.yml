name: Refresh activity

# Keeps the activity line at the top of the README current.
#
# The default GITHUB_TOKEN can read the contribution calendar (which counts
# private work) but not the commit and PR totals behind it, so the line falls
# back to contribution counts alone. Add a classic PAT with the `read:user`
# scope as a repo secret named PROFILE_TOKEN and the commit, PR, and repo
# numbers appear too.

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activity.yml'
      - '.github/scripts/update-activity.mjs'

permissions:
  contents: write

concurrency:
  group: refresh-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update activity block
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/update-activity.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh activity' -- README.md
          git push
